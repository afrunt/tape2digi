name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build frontend
        run: cd frontend && npm install --no-audit --no-fund && npm run check && npm run build
      - name: Vet
        run: go vet -tags webkit2_41 ./...
      - name: Test
        run: go test -tags webkit2_41 ./...
      - name: Build Linux amd64
        run: make dist-linux-amd64
